<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Server Error — Groot</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
       background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.box { text-align: center; max-width: 400px; padding: 24px; }
.icon { font-size: 52px; color: #D97706; margin-bottom: 16px; }
h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
p { font-size: 14px; color: #6b6b6b; margin-bottom: 22px; line-height: 1.6; }
a { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px;
    background: #1A4FA0; color: #fff; border-radius: 8px; font-size: 13px;
    font-weight: 600; text-decoration: none; }
a:hover { background: #0D3070; }
</style>
</head>
<body>
<div class="box">
  <div class="icon"><i class="ti ti-alert-triangle"></i></div>
  <h1>Something went wrong</h1>
  <p>An unexpected error occurred. The team has been notified.<br>
     If this keeps happening, please contact your system administrator.</p>
  <a href="/dashboard"><i class="ti ti-arrow-left"></i> Back to Dashboard</a>
</div>
</body>
</html>
