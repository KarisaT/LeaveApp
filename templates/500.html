<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Server Error — Groot Leave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
       background: #F1F5F9; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.box { text-align: center; max-width: 400px; padding: 24px; }
.icon { width: 64px; height: 64px; border-radius: 50%; background: #FEF3C7; color: #B45309;
        font-size: 26px; display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; }
h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: #0C192C; letter-spacing: -0.3px; }
p { font-size: 14px; color: #64748B; margin-bottom: 22px; line-height: 1.6; }
a { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px;
    background: #0C192C; color: #fff; border-radius: 8px; font-size: 13px;
    font-weight: 600; text-decoration: none; font-family: inherit; transition: background 0.15s; }
a:hover { background: #16263F; }
</style>
</head>
<body>
<div class="box">
  <div class="icon"><i class="ti ti-alert-triangle"></i></div>
  <h1>Something went wrong</h1>
  <p>An unexpected error occurred. The team has been notified.<br>
     If this keeps happening, please contact your system administrator.</p>
  <a href="/dashboard"><i class="ti ti-arrow-left"></i> Back to Dashboard</a>
</div>
</body>
</html>
